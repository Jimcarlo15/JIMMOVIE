<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine & Anime Vault - MySQL / phpMyAdmin Catalog</title>
    
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-amber-500 p-2 rounded-lg text-slate-950">
                    <i data-lucide="clapperboard" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white">CineAnime Catalog</h1>
                    <p class="text-xs text-slate-400">phpMyAdmin MySQL Backend</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <button onclick="toggleModal('addModal')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold px-4 py-2 rounded-lg flex items-center gap-2 text-sm transition">
                    <i data-lucide="plus" class="w-4 h-4"></i> Add Entry
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <section class="mb-8 flex flex-col md:flex-row gap-4 justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-800">
            <div class="relative w-full md:w-80">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="filterMedia()" placeholder="Search Hollywood or Anime..." 
                       class="w-full pl-9 pr-4 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm focus:outline-none focus:border-amber-500 transition">
            </div>

            <div class="flex gap-2 w-full md:w-auto overflow-x-auto pb-2 md:pb-0">
                <button onclick="setCategoryFilter('ALL')" id="filter-ALL" class="filter-btn active-tab">All</button>
                <button onclick="setCategoryFilter('Hollywood')" id="filter-Hollywood" class="filter-btn">🎬 Hollywood</button>
                <button onclick="setCategoryFilter('Anime')" id="filter-Anime" class="filter-btn">⛩️ Anime</button>
            </div>
        </section>

        <div id="loader" class="text-center py-20">
            <i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto text-amber-500 mb-2"></i>
            <p class="text-sm text-slate-400">Connecting to MySQL Database...</p>
        </div>

        <div id="mediaGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 hidden">
        </div>
    </main>

    <div id="addModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md overflow-hidden">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center">
                <h3 class="font-bold text-lg text-white">Add New Movie or Anime</h3>
                <button onclick="toggleModal('addModal')" class="text-slate-400 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <form id="addForm" onsubmit="handleAddSubmit(event)" class="p-4 space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Title</label>
                    <input type="text" id="title" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Category</label>
                        <select id="category" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
                            <option value="Hollywood">Hollywood</option>
                            <option value="Anime">Anime</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Rating (0 - 10)</label>
                        <input type="number" id="rating" step="0.1" min="0" max="10" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Genre</label>
                        <input type="text" id="genre" placeholder="Action, Sci-Fi" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Release Year</label>
                        <input type="number" id="year" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Poster Image URL</label>
                    <input type="url" id="posterUrl" placeholder="https://..." required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Description</label>
                    <textarea id="description" rows="3" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500"></textarea>
                </div>

                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="toggleModal('addModal')" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-lg text-sm hover:bg-slate-700">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-amber-500 text-slate-950 font-semibold rounded-lg text-sm hover:bg-amber-400">Save to MySQL</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
